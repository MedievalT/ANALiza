<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANALiza</title>
<style>
body{background:#18181b;color:white;font-family:system-ui;padding:15px}
.card{background:#27272a;padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
select{background:#3f3f46;color:white;border:0;padding:8px 10px;border-radius:8px;font-size:14px}
input{width:100%;background:#27272a;border:0;padding:14px;border-radius:12px;color:white;font-size:18px;font-weight:900}
button{border:0;cursor:pointer}
.btnW{background:white;color:black;font-weight:900;padding:14px;border-radius:12px;width:100%}
.save{cursor:pointer;background:#27272a;padding:12px;border-radius:12px;margin-bottom:8px}
.save b{display:block}
</style>
</head>
<body>
<div style="max-width:900px;margin:auto">
<h1 style="font-size:28px;font-weight:900;margin:0">ANALiza</h1>
<p style="color:#a1a1aa;font-size:13px;margin-top:4px;margin-bottom:20px">Your 9 metrics • Max 27p • Auto-saves on this device</p>

<input id="ticker" placeholder="TICKER - e.g. ROL, NVDA">

<div style="margin-top:20px" id="list">
<div class="card"><span>P/E</span><select id="m0"><option value="3"><15 - 3p</option><option value="2">15-20 - 2p</option><option value="1">>20 - 1p</option></select></div>
<div class="card"><span>Debt</span><select id="m1"><option value="3">Low - 3p</option><option value="2">Medium - 2p</option><option value="1">Large - 1p</option></select></div>
<div class="card"><span>Free Cash Flow</span><select id="m2"><option value="3">Growing - 3p</option><option value="2">Alternating - 2p</option><option value="1">Inconsistent - 1p</option></select></div>
<div class="card"><span>Stock Based Comp / FCF</span><select id="m3"><option value="3">Under 10% - 3p</option><option value="2">10-15% - 2p</option><option value="1">>15% - 1p</option></select></div>
<div class="card"><span>Buybacks</span><select id="m4"><option value="3">Consistent 10y - 3p</option><option value="2">Low - 2p</option><option value="1">No buybacks - 1p</option></select></div>
<div class="card"><span>Cash</span><select id="m5"><option value="3">10% of mkt cap - 3p</option><option value="2">Under 10% - 2p</option><option value="1">Low cash - 1p</option></select></div>
<div class="card"><span>Moat</span><select id="m6"><option value="3">Moat - 3p</option><option value="2">Top 10 in sector - 2p</option><option value="1">No moat - 1p</option></select></div>
<div class="card"><span>Dividend Payout</span><select id="m7"><option value="3">Under 35% - 3p</option><option value="2">35-55% - 2p</option><option value="1">>55% - 1p</option></select></div>
<div class="card"><span>Growing EPS</span><select id="m8"><option value="3">Consistent - 3p</option><option value="2">Low growth - 2p</option><option value="1">Inconsistent - 1p</option></select></div>
</div>

<div style="background:#27272a;border-radius:16px;padding:20px;margin-top:20px;text-align:center">
<div id="score" style="font-size:40px;font-weight:900">0 / 27</div>
<div id="rec" style="margin-top:10px;padding:12px;border-radius:10px;background:#3f3f46;font-weight:900;letter-spacing:1px">HOLD</div>
</div>

<button class="btnW" style="margin-top:15px" onclick="saveCo()">SAVE THIS COMPANY</button>

<h3 style="margin-top:30px">Saved Companies</h3>
<div id="hist" style="margin-top:10px"></div>
</div>

<script>
function calc(){
 let t=0;
 for(let i=0;i<9;i++){ t+=parseInt(document.getElementById('m'+i).value); }
 document.getElementById('score').innerText=t+' / 27';
 let r=t>=23?'STRONG BUY':t>=18?'BUY':t>=12?'HOLD':'AVOID';
 let c=t>=23?'#22c55e':t>=18?'#84cc16':t>=12?'#eab308':'#ef4444';
 let el=document.getElementById('rec'); el.innerText=r; el.style.background=c; el.style.color=t<12?'white':'black';
 return t;
}
document.querySelectorAll('select').forEach(s=>s.addEventListener('change',calc));
calc();

function saveCo(){
 let ticker=document.getElementById('ticker').value;
 if(!ticker){alert('Write ticker first');return}
 let vals=[]; for(let i=0;i<9;i++) vals.push(document.getElementById('m'+i).value);
 let total=calc();
 let h=JSON.parse(localStorage.getItem('analiza')||'[]');
 h.unshift({ticker:ticker.toUpperCase(),date:new Date().toLocaleDateString(),total:total,vals:vals});
 localStorage.setItem('analiza',JSON.stringify(h));
 renderH();
}
function renderH(){
 let h=JSON.parse(localStorage.getItem('analiza')||'[]');
 let html='';
 h.forEach((x,i)=>{
   html+=`<div class="save" onclick="loadCo(${i})"><div style="display:flex;justify-content:space-between"><b>${x.ticker}</b><span style="font-size:11px;color:#a1a1aa">${x.date}</span></div><div style="font-size:13px;margin-top:4px">${x.total}/27</div></div>`;
 });
 document.getElementById('hist').innerHTML=html||'<p style="color:#71717a;font-size:12px">Nothing saved yet</p>';
}
function loadCo(i){
 let h=JSON.parse(localStorage.getItem('analiza')||'[]')[i];
 document.getElementById('ticker').value=h.ticker;
 for(let j=0;j<9;j++) document.getElementById('m'+j).value=h.vals[j];
 calc();
}
renderH();
</script>
</body>
</html>
