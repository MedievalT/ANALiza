<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANALiza</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen">
<div class="max-w-5xl mx-auto p-4">
  <h1 class="text-3xl font-black">ANALiza</h1>
  <p class="text-zinc-400 text-sm mb-6">Private scoring tool • 9 metrics • Max 27p</p>

  <div class="grid md:grid-cols-2 gap-6">
    <div>
      <label class="text-xs text-zinc-400">TICKER</label>
      <input id="ticker" class="w-full mt-1 p-3 rounded-xl bg-zinc-800 font-black text-lg outline-none" placeholder="e.g. NVDA" oninput="doRender()">

      <div id="metrics" class="mt-6 space-y-3"></div>

      <button onclick="saveNow()" class="w-full mt-6 bg-white text-black font-black py-3 rounded-xl">SAVE THIS COMPANY</button>

      <div id="result" class="mt-6 bg-zinc-800 rounded-2xl p-5">
        <div class="flex justify-between items-center">
          <div>
            <div id="rTicker" class="text-2xl font-black">—</div>
            <div id="rDate" class="text-xs text-zinc-500"></div>
          </div>
          <div id="rScore" class="bg-zinc-700 px-5 py-3 rounded-xl text-2xl font-black">0 / 27</div>
        </div>
        <div id="rRec" class="mt-4 text-center font-black py-3 rounded-xl bg-zinc-700">—</div>
        <div id="rList" class="mt-4 space-y-2 text-sm"></div>
      </div>
    </div>

    <div class="bg-zinc-800 rounded-2xl p-4 h-fit">
      <h2 class="font-black mb-3">Saved Companies</h2>
      <div id="history"></div>
      <button onclick="localStorage.clear();renderHistory();alert('cleared')" class="w-full mt-4 bg-zinc-700 py-2 rounded-lg text-xs">Clear All</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {k:'pe', n:'P/E', o:[['<15',3],['15-20',2],['>20',1]]},
  {k:'debt', n:'Debt', o:[['Low',3],['Medium',2],['Large',1]]},
  {k:'fcf', n:'Free Cash Flow', o:[['Growing',3],['Alternating',2],['Inconsistent',1]]},
  {k:'sbc', n:'Stock Based Comp / FCF', o:[['Under 10%',3],['10-15% per FCF',2],['>15% per FCF',1]]},
  {k:'buy', n:'Buybacks', o:[['Consistent 10y',3],['Low',2],['No buybacks',1]]},
  {k:'cash', n:'Cash', o:[['10% of Market Cap',3],['Under 10%',2],['Low cash',1]]},
  {k:'moat', n:'Moat', o:[['Moat',3],['Top 10 in sector',2],['No moat',1]]},
  {k:'div', n:'Dividend Payout Ratio', o:[['Under 35%',3],['35-55%',2],['>55%',1]]},
  {k:'eps', n:'Growing EPS', o:[['Consistent',3],['Low growth',2],['Inconsistent',1]]},
];
let sel = {};
DATA.forEach(d=> sel[d.k]=0);

const cont = document.getElementById('metrics');
DATA.forEach(d=>{
  let opts = d.o.map((x,i)=>`<option value="${i}">${x[0]} - ${x[1]}p</option>`).join('');
  cont.innerHTML += <div class="bg-zinc-800 p-3 rounded-xl flex justify-between items-center"><span class="text-sm font-medium">${d.n}</span><select onchange="sel['${d.k}']=parseInt(this.value);doRender()" class="bg-zinc-700 px-3 py-1 rounded-lg text-sm">${opts}</select></div>;
});

function doRender(){
  let total=0;
  let list='';
  DATA.forEach(d=>{
    let idx=sel[d.k]; let pts=d.o[idx][1]; total+=pts;
    let color = pts==3?'#22c55e':pts==2?'#eab308':'#ef4444';
    list += <div class="flex justify-between bg-zinc-900 p-2 rounded-lg"><span>${d.n}</span><span style="background:${color}" class="px-2 rounded font-bold ${pts==1?'text-white':'text-black'}">${d.o[idx][0]} ${pts}p</span></div>;
  });
  let rec = total>=23?'STRONG BUY':total>=18?'BUY':total>=12?'HOLD':'AVOID';
  let bg = total>=23?'#22c55e':total>=18?'#84cc16':total>=12?'#eab308':'#ef4444';
  document.getElementById('rTicker').innerText = (document.getElementById('ticker').value||'—').toUpperCase();
  document.getElementById('rDate').innerText = new Date().toLocaleString();
  document.getElementById('rScore').innerText = total+' / 27';
  document.getElementById('rScore').style.background = bg;
  document.getElementById('rScore').style.color = total<12?'white':'black';
  document.getElementById('rRec').innerText = rec;
  document.getElementById('rRec').style.background = bg;
  document.getElementById('rRec').style.color = total<12?'white':'black';
  document.getElementById('rList').innerHTML = list;
}

function saveNow(){
  let t = document.getElementById('ticker').value;
  if(!t){ alert('Write ticker first'); return; }
  let total=0; DATA.forEach(d=> total+=d.o[sel[d.k]][1]);
  let h = JSON.parse(localStorage.getItem('h')||'[]');
  h.unshift({ticker:t.toUpperCase(), date:new Date().toLocaleString(), sel:JSON.parse(JSON.stringify(sel)), total:total});
  localStorage.setItem('h', JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  let h = JSON.parse(localStorage.getItem('h')||'[]');
  let html='';
  if(h.length==0) html='<p class="text-xs text-zinc-500">Nothing saved yet</p>';
  h.forEach((x,i)=>{
    html+=`<div onclick="loadH(${i})" class="bg-zinc-900 p-3 rounded-xl mb-2 cursor-pointer hover:bg-black"><div class="flex justify-between"><b>${x.ticker}</b><span class="text-[10px] text-zinc-400">${x.date}</span></div><div class="text-xs mt-1">${x.total}/27</div></div>`;
  });
  document.getElementById('history').innerHTML=html;
}
function loadH(i){
  let h = JSON.parse(localStorage.getItem('h')||'[]')[i];
  document.getElementById('ticker').value=h.ticker;
  sel=h.sel;
  // rebuild selects to reflect
  const cont = document.getElementById('metrics'); cont.innerHTML='';
  DATA.forEach(d=>{
    let opts = d.o.map((x,ii)=>`<option value="${ii}" ${sel[d.k]==ii?'selected':''}>${x[0]} - ${x[1]}p</option>`).join('');
    cont.innerHTML += <div class="bg-zinc-800 p-3 rounded-xl flex justify-between items-center"><span class="text-sm font-medium">${d.n}</span><select onchange="sel['${d.k}']=parseInt(this.value);doRender()" class="bg-zinc-700 px-3 py-1 rounded-lg text-sm">${opts}</select></div>;
  });
  doRender();
}
doRender(); renderHistory();
</script>
</body>
</html>
